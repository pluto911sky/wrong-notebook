<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="mBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </radialGradient>
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="piggy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="mShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 背景圆形 -->
  <circle cx="100" cy="100" r="92" fill="url(#mBg)" stroke="#10b981" stroke-width="4"/>

  <!-- 漂浮的绿色纸币钞票 -->
  <g filter="url(#mShadow)" transform="rotate(-25 45 60)">
    <rect x="20" y="45" width="50" height="28" rx="3" fill="#34d399" stroke="#059669" stroke-width="2"/>
    <circle cx="45" cy="59" r="7" fill="#10b981"/>
    <text x="45" y="63" font-size="10" font-weight="900" text-anchor="middle" fill="#ffffff">¥</text>
  </g>
  <g filter="url(#mShadow)" transform="rotate(20 160 55)">
    <rect x="135" y="40" width="50" height="28" rx="3" fill="#34d399" stroke="#059669" stroke-width="2"/>
    <circle cx="160" cy="54" r="7" fill="#10b981"/>
    <text x="160" y="58" font-size="10" font-weight="900" text-anchor="middle" fill="#ffffff">¥</text>
  </g>

  <!-- 萌萌粉红小猪存钱罐 (主体) -->
  <g filter="url(#mShadow)">
    <!-- 小猪腿 -->
    <rect x="68" y="152" width="14" height="18" rx="6" fill="#f43f5e"/>
    <rect x="122" y="152" width="14" height="18" rx="6" fill="#f43f5e"/>

    <!-- 小耳朵 -->
    <polygon points="68,90 55,62 82,76" fill="#fb7185"/>
    <polygon points="69,87 60,68 79,77" fill="#fecdd3"/>
    <polygon points="128,76 155,62 142,90" fill="#fb7185"/>
    <polygon points="131,77 150,68 141,87" fill="#fecdd3"/>

    <!-- 小猪圆滚滚身体 -->
    <ellipse cx="102" cy="120" rx="48" ry="40" fill="url(#piggy)"/>

    <!-- 弯弯小卷尾巴 -->
    <path d="M54,124 C45,120 40,110 46,105 C50,102 54,106 50,110" stroke="#f43f5e" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- 投币口 -->
    <rect x="92" y="80" width="22" height="5" rx="2.5" fill="#881337"/>

    <!-- 大圆猪鼻子 -->
    <ellipse cx="128" cy="122" rx="16" ry="12" fill="#fb7185" stroke="#f43f5e" stroke-width="2"/>
    <ellipse cx="123" cy="122" rx="3" ry="5" fill="#881337"/>
    <ellipse cx="133" cy="122" rx="3" ry="5" fill="#881337"/>

    <!-- 快乐弯弯眯眯眼 -->
    <path d="M96,110 Q104,102 112,110" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- 腮红 -->
    <circle cx="104" cy="124" r="6" fill="#fda4af" opacity="0.8"/>
  </g>

  <!-- 掉落入小猪头顶的巨大金色硬币 -->
  <g filter="url(#mShadow)">
    <circle cx="103" cy="55" r="22" fill="url(#goldCoin)" stroke="#d97706" stroke-width="2.5"/>
    <circle cx="103" cy="55" r="17" fill="none" stroke="#fde047" stroke-width="1.8" stroke-dasharray="4,2"/>
    <text x="103" y="64" font-size="24" font-weight="900" text-anchor="middle" fill="#78350f">¥</text>
    <!-- 高光 -->
    <path d="M90,45 A16,16 0 0,1 116,45" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- 旁边两颗散落金币 -->
  <g filter="url(#mShadow)">
    <circle cx="48" cy="148" r="12" fill="url(#goldCoin)" stroke="#d97706" stroke-width="1.5"/>
    <text x="48" y="153" font-size="13" font-weight="900" text-anchor="middle" fill="#78350f">★</text>
    <circle cx="158" cy="148" r="13" fill="url(#goldCoin)" stroke="#d97706" stroke-width="1.5"/>
    <text x="158" y="153" font-size="14" font-weight="900" text-anchor="middle" fill="#78350f">★</text>
  </g>
</svg>
