<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="tBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </radialGradient>
    <linearGradient id="ferrisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="tShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 背景圆形 -->
  <circle cx="100" cy="100" r="92" fill="url(#tBg)" stroke="#06b6d4" stroke-width="4"/>

  <!-- 金色灿烂小太阳 -->
  <g transform="translate(145, 25)">
    <circle cx="20" cy="20" r="14" fill="#facc15" stroke="#f59e0b" stroke-width="2"/>
    <line x1="20" y1="2" x2="20" y2="-3" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="38" x2="20" y2="43" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="2" y1="20" x2="-3" y2="20" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="38" y1="20" x2="43" y2="20" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 太阳笑脸与墨镜 -->
    <rect x="12" y="16" width="7" height="5" rx="2" fill="#1e293b"/>
    <rect x="21" y="16" width="7" height="5" rx="2" fill="#1e293b"/>
    <line x1="18" y1="18" x2="22" y2="18" stroke="#1e293b" stroke-width="2"/>
    <path d="M17,25 Q20,28 23,25" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 白云朵朵 -->
  <path d="M25,48 C25,43 30,38 36,38 C39,34 45,34 49,37 C54,35 60,38 61,43 C65,44 68,48 67,52 C67,56 63,59 58,59 L28,59 C24,59 21,55 22,51 C22,49 23,48 25,48 Z" fill="#ffffff" opacity="0.9"/>

  <!-- 绿茵草地山丘底座 -->
  <path d="M12,145 Q55,128 100,138 Q145,148 188,145 L188,185 C168,193 135,196 100,196 C65,196 32,193 12,185 Z" fill="#4ade80"/>
  <path d="M12,158 Q55,145 100,152 Q145,158 188,155 L188,185 C168,193 135,196 100,196 C65,196 32,193 12,185 Z" fill="#22c55e"/>

  <!-- 游乐园摩天轮 (主体) -->
  <g filter="url(#tShadow)">
    <!-- 支架 (人字形) -->
    <polygon points="100,105 72,168 80,168 100,118 120,168 128,168" fill="#f43f5e" stroke="#be123c" stroke-width="1.5"/>

    <!-- 摩天轮外双圈 -->
    <circle cx="100" cy="98" r="46" fill="none" stroke="url(#ferrisGrad)" stroke-width="3.5"/>
    <circle cx="100" cy="98" r="41" fill="none" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- 摩天轮辐条八根 -->
    <line x1="100" y1="52" x2="100" y2="144" stroke="#0284c7" stroke-width="2"/>
    <line x1="54" y1="98" x2="146" y2="98" stroke="#0284c7" stroke-width="2"/>
    <line x1="68" y1="66" x2="132" y2="130" stroke="#0284c7" stroke-width="2"/>
    <line x1="68" y1="130" x2="132" y2="66" stroke="#0284c7" stroke-width="2"/>

    <!-- 中心轴圆盘 -->
    <circle cx="100" cy="98" r="8" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>

    <!-- 八个彩色小座舱 (吊厢) -->
    <!-- 上 -->
    <rect x="94" y="47" width="12" height="11" rx="3" fill="#ef4444"/>
    <rect x="96" y="49" width="8" height="4" rx="1" fill="#fef08a"/>
    <!-- 下 -->
    <rect x="94" y="139" width="12" height="11" rx="3" fill="#3b82f6"/>
    <rect x="96" y="141" width="8" height="4" rx="1" fill="#fef08a"/>
    <!-- 左 -->
    <rect x="49" y="92" width="12" height="11" rx="3" fill="#eab308"/>
    <rect x="51" y="94" width="8" height="4" rx="1" fill="#ffffff"/>
    <!-- 右 -->
    <rect x="139" y="92" width="12" height="11" rx="3" fill="#10b981"/>
    <rect x="141" y="94" width="8" height="4" rx="1" fill="#ffffff"/>
    <!-- 左上 -->
    <rect x="63" y="61" width="12" height="11" rx="3" fill="#ec4899"/>
    <!-- 右上 -->
    <rect x="125" y="61" width="12" height="11" rx="3" fill="#8b5cf6"/>
    <!-- 左下 -->
    <rect x="63" y="124" width="12" height="11" rx="3" fill="#f97316"/>
    <!-- 右下 -->
    <rect x="125" y="124" width="12" height="11" rx="3" fill="#06b6d4"/>
  </g>

  <!-- 热气球 (左侧空中) -->
  <g filter="url(#tShadow)">
    <path d="M28,88 C20,78 20,64 30,56 C40,48 50,56 46,70 C44,78 36,88 36,88 Z" fill="#f43f5e"/>
    <path d="M33,56 C37,64 37,76 33,88 C29,76 29,64 33,56 Z" fill="#facc15"/>
    <line x1="31" y1="88" x2="31" y2="93" stroke="#78350f" stroke-width="1"/>
    <line x1="35" y1="88" x2="35" y2="93" stroke="#78350f" stroke-width="1"/>
    <rect x="29" y="93" width="8" height="6" rx="1.5" fill="#b45309"/>
  </g>
</svg>
